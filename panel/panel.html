<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ChatDeck Legacy — Twitch Chat для OBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d11;
  --surface: #16161c;
  --border: #26262f;
  --border-hover: #3a3a46;
  --text: #f0f0f4;
  --muted: #8b8b98;
  --faint: #55555f;
  --accent: #9147ff;
  --accent-soft: rgba(145,71,255,0.13);
  --green: #2ee6a8;
  --red: #ff5c5c;
  --amber: #ffb454;
  --display: 'Unbounded', sans-serif;
  --body: 'Rubik', 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', 'Consolas', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text); font-family: var(--body);
  height: 100vh; overflow: hidden; display: flex; flex-direction: column;
}

/* --- фон: свечения + сетка --- */
.bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(500px 300px at -10% -10%, rgba(145,71,255,0.15), transparent 70%),
    radial-gradient(400px 300px at 110% 110%, rgba(46,230,168,0.08), transparent 70%);
}
.bg::after {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size: 20px 20px;
}
header, main, footer { position: relative; z-index: 1; }

/* --- header --- */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 18px; border-bottom: 1px solid var(--border);
  background: rgba(13,13,17,0.92);
  -webkit-app-region: drag;
}
header button { -webkit-app-region: no-drag; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-name {
  font-family: var(--display); font-weight: 900; font-size: 15px; letter-spacing: .02em;
  display: flex; align-items: center; gap: 7px;
}
.brand-name span { color: var(--accent); }
.badge-legacy {
  font-family: var(--body); font-size: 9px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.08em; padding: 2px 6px; border-radius: 999px;
  background: var(--accent-soft); color: #cbb0ff; border: 1px solid rgba(145,71,255,0.3);
}

.header-actions { display: flex; gap: 6px; }
.hbtn {
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  border-radius: 6px; width: 30px; height: 30px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .2s;
}
.hbtn:hover { border-color: var(--accent); color: #cbb0ff; background: var(--accent-soft); }
.hbtn-danger:hover { border-color: var(--red); color: var(--red); background: rgba(255,92,92,.08); }

/* --- layout --- */
main {
  flex: 1; overflow-y: auto; padding: 14px 18px;
  display: flex; flex-direction: column; gap: 12px;
}
main::-webkit-scrollbar { width: 6px; }
main::-webkit-scrollbar-thumb { background: #26262f; border-radius: 3px; }

/* --- статус-полоска --- */
.status-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-radius: 9px;
  background: var(--surface); border: 1px solid var(--border);
}
.status-left { display: flex; align-items: center; gap: 9px; }
.status-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--faint); flex-shrink: 0;
}
.status-bar.live .status-dot { background: var(--red); animation: pulseR 1.5s infinite; }
.status-bar.online .status-dot { background: var(--green); }
.status-bar.connecting .status-dot { background: var(--amber); animation: pulseA 1.2s infinite; }
.status-bar.off .status-dot { background: var(--red); }
.status-title { font-size: 13px; font-weight: 600; color: var(--text); }
.status-tag {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 5px; background: rgba(255,255,255,0.05); color: var(--muted);
}
.status-bar.live .status-tag { background: rgba(255,92,92,0.12); color: #ff8080; }

@keyframes pulseR { 0% { box-shadow: 0 0 0 0 rgba(255,92,92,.5); } 70% { box-shadow: 0 0 0 6px rgba(255,92,92,0); } 100% { box-shadow: 0 0 0 0 rgba(255,92,92,0); } }
@keyframes pulseA { 0% { box-shadow: 0 0 0 0 rgba(255,180,84,.5); } 70% { box-shadow: 0 0 0 6px rgba(255,180,84,0); } 100% { box-shadow: 0 0 0 0 rgba(255,180,84,0); } }

/* --- статистика 4 плитки --- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 10px; text-align: center;
}
.stat-num {
  font-family: var(--display); font-weight: 700; font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff;
}
.stat-label {
  font-size: 9px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin-top: 3px;
}
.stat-num.bump { animation: bump .35s ease; }
@keyframes bump { 40% { transform: scale(1.16); color: var(--green); } }

/* --- OBS карточка ссылки --- */
.card-obs {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 15px;
}
.card-label {
  font-size: 10px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
}
.url-box {
  background: #0a0a0e; border: 1px solid var(--border);
  border-radius: 7px; padding: 9px 11px;
}
.url-box code {
  display: block; width: 100%; font-family: var(--mono); font-size: 13px;
  color: var(--green); user-select: all; word-break: break-all;
}
.url-actions { display: flex; gap: 8px; margin-top: 10px; }
.btn {
  font-family: var(--body); font-weight: 600; font-size: 12px;
  border-radius: 6px; padding: 9px 12px; border: 1px solid transparent;
  cursor: pointer; transition: all .2s; display: inline-flex;
  align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: #fff; flex: 2; }
.btn-primary:hover { background: #a063ff; box-shadow: 0 4px 14px rgba(145,71,255,.35); }
.btn-primary.done { background: var(--green); color: #06281c; }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border); flex: 1; }
.btn-ghost:hover { border-color: var(--accent); color: #cbb0ff; background: var(--accent-soft); }
.url-hint { font-size: 11px; color: var(--faint); margin-top: 8px; }

/* --- триггер стилей --- */
.trigger-card {
  display: flex; align-items: center; gap: 11px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: 12px 14px; cursor: pointer; transition: all .2s;
}
.trigger-card:hover { border-color: var(--accent); background: rgba(22,22,28,0.95); }
.trigger-ico {
  width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
  background: var(--accent-soft); border: 1px solid rgba(145,71,255,0.25); flex-shrink: 0;
}
.trigger-ico svg { width: 17px; height: 17px; }
.trigger-txt { flex: 1; min-width: 0; }
.trigger-title { font-size: 13px; font-weight: 600; color: #fff; display: block; }
.trigger-sum {
  font-size: 11px; color: var(--muted); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; display: block; margin-top: 1px;
}
.trigger-chev { color: var(--muted); flex-shrink: 0; }

footer {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 18px; border-top: 1px solid var(--border);
  font-size: 10px; color: var(--faint);
}

/* --- МОДАЛЬНОЕ ОКНО СТИЛЕЙ --- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: center; padding: 16px;
  background: rgba(6,6,9,.75); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .25s ease, visibility .25s ease;
}
.modal-backdrop.open { opacity: 1; visibility: visible; pointer-events: auto; }
.modal-card {
  width: 420px; max-width: 100%; max-height: 94vh; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border-hover); border-radius: 12px;
  box-shadow: 0 24px 60px rgba(0,0,0,.7); transform: scale(.97); opacity: 0;
  transition: transform .25s ease, opacity .25s ease;
}
.modal-backdrop.open .modal-card { transform: none; opacity: 1; }
.modal-head {
  padding: 14px 18px 12px; background: rgba(22,22,28,.95);
  border-bottom: 1px solid var(--border); border-radius: 12px 12px 0 0;
  display: flex; align-items: center; justify-content: space-between;
}
.modal-head h2 { font-size: 15px; font-weight: 700; }
.modal-close {
  width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center;
}
.modal-close:hover { border-color: var(--red); color: var(--red); }
.modal-body { padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 13px; }
.modal-body::-webkit-scrollbar { width: 6px; }
.modal-body::-webkit-scrollbar-thumb { background: #26262f; border-radius: 3px; }
.modal-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px; border-top: 1px solid var(--border); border-radius: 0 0 12px 12px;
}

/* микро-превью в модалке */
.style-preview-frame {
  border-radius: 8px; border: 1px solid var(--border); padding: 10px;
  background-color: #101015;
  background-image:
    linear-gradient(45deg, #17171d 25%, transparent 25%),
    linear-gradient(-45deg, #17171d 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #17171d 75%),
    linear-gradient(-45deg, transparent 75%, #17171d 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
}
.style-preview-line {
  border-radius: 6px; line-height: 1.5; word-break: normal;
  text-shadow: 0 1px 2px rgba(0,0,0,.9);
}
.style-preview-line .colon { margin: 0 4px 0 1px; color: #adadb8; }
.style-preview-line.role-broadcaster {
  border-left: 3px solid #a970ff;
  box-shadow: 0 0 0 1px rgba(169,112,255,0.28), 0 4px 16px rgba(169,112,255,0.12);
}

.ctl label {
  display: flex; justify-content: space-between; font-size: 11px;
  font-weight: 600; color: var(--muted); margin-bottom: 5px;
}
.ctl label span { color: var(--accent); font-family: var(--mono); }
.ctl-select, .ctl-input {
  width: 100%; padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: #0a0a0e; color: var(--text);
  font-size: 12px; outline: none;
}
.ctl-range {
  -webkit-appearance: none; appearance: none; width: 100%; height: 5px;
  border-radius: 999px; background: #26262f; outline: none; cursor: pointer;
}
.ctl-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
  border-radius: 50%; background: var(--accent); border: 2px solid #16161c;
}
.ctl-row { display: flex; align-items: center; justify-content: space-between; }
.switch { position: relative; width: 36px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .track {
  position: absolute; inset: 0; border-radius: 999px; cursor: pointer;
  background: #26262f; border: 1px solid var(--border); transition: .2s;
}
.switch .track::before {
  content: ''; position: absolute; height: 14px; width: 14px; left: 2px; top: 2px;
  border-radius: 50%; background: var(--muted); transition: .2s;
}
.switch input:checked + .track { background: var(--accent-soft); border-color: var(--accent); }
.switch input:checked + .track::before { transform: translateX(16px); background: var(--accent); }
.ctl-color-row { display: flex; align-items: center; gap: 8px; }
.ctl-color {
  -webkit-appearance: none; border: 1px solid var(--border); border-radius: 6px;
  width: 32px; height: 28px; padding: 2px; background: #0a0a0e; cursor: pointer;
}
.ctl-color::-webkit-color-swatch-wrapper { padding: 0; }
.ctl-color::-webkit-color-swatch { border: none; border-radius: 4px; }
.ctl-hex { font-family: var(--mono); width: 75px; text-transform: uppercase; font-size: 11px; }
.ctl.disabled { opacity: .4; pointer-events: none; }
</style>
</head>
<body>
<div class="bg"></div>

<header>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 32 32">
      <rect x="1" y="1" width="30" height="30" rx="8" fill="#9147ff"/>
      <rect x="7" y="8" width="18" height="13" rx="4" fill="#fff"/>
      <path d="M11 21 L11 26 L16 21 Z" fill="#fff"/>
      <circle cx="12" cy="14.5" r="1.6" fill="#9147ff"/>
      <circle cx="16" cy="14.5" r="1.6" fill="#9147ff"/>
      <circle cx="20" cy="14.5" r="1.6" fill="#9147ff"/>
    </svg>
    <div class="brand-name">CHAT<span>DECK</span> <span class="badge-legacy">Legacy</span></div>
  </div>
  <div class="header-actions">
    <button class="hbtn" id="settingsBtn" title="Настройки">⚙</button>
    <button class="hbtn" id="restartBtn" title="Перезапустить чат">↻</button>
    <button class="hbtn hbtn-danger" id="quitBtn" title="Выход">✕</button>
  </div>
</header>

<main>
  <!-- Статус стрима -->
  <div class="status-bar connecting" id="statusBar">
    <div class="status-left">
      <span class="status-dot"></span>
      <span class="status-title" id="statusTitle">Подключение…</span>
    </div>
    <span class="status-tag" id="statusTag">Офлайн</span>
  </div>

  <!-- Статистика -->
  <div class="stats">
    <div class="stat"><div class="stat-num" id="statChannel">—</div><div class="stat-label">Канал</div></div>
    <div class="stat"><div class="stat-num" id="statPort">6767</div><div class="stat-label">Порт</div></div>
    <div class="stat"><div class="stat-num" id="statMsgs">0</div><div class="stat-label">Чат</div></div>
    <div class="stat"><div class="stat-num" id="statUptime">Офлайн</div><div class="stat-label" id="statUptimeLabel">Стрим</div></div>
  </div>

  <!-- OBS ссылка -->
  <div class="card-obs">
    <div class="card-label">Ссылка для OBS (Браузер)</div>
    <div class="url-box">
      <code id="obsUrl">http://localhost:6767</code>
    </div>
    <div class="url-actions">
      <button class="btn btn-primary" id="copyBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span class="bl">Копировать ссылку</span>
      </button>
      <button class="btn btn-ghost" id="openBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5"/><path d="M19 5 10 14"/><path d="M19 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/></svg>
        <span>Открыть</span>
      </button>
    </div>
    <div class="url-hint">Добавьте в OBS как «Браузер» (рекомендуемый размер 450×700).</div>
  </div>

  <!-- Кнопка стиля оверлея -->
  <div class="trigger-card" id="openStyleBtn" tabindex="0" role="button">
    <span class="trigger-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="#cbb0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a9 9 0 1 0 0 18c1 0 1.6-.8 1.6-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.1 0-.9.8-1.6 1.7-1.6H16a5 5 0 0 0 5-5c0-3.9-4-7.4-9-7.4Z"/>
        <circle cx="7.5" cy="11" r="1.1" fill="#cbb0ff" stroke="none"/>
        <circle cx="10.5" cy="7.5" r="1.1" fill="#cbb0ff" stroke="none"/>
        <circle cx="14.5" cy="7.5" r="1.1" fill="#cbb0ff" stroke="none"/>
        <circle cx="17" cy="11" r="1.1" fill="#cbb0ff" stroke="none"/>
      </svg>
    </span>
    <span class="trigger-txt">
      <span class="trigger-title">Стиль чата</span>
      <span class="trigger-sum" id="trigSummary">Segoe UI · 14px · плашка · 30с</span>
    </span>
    <span class="trigger-chev">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </span>
  </div>
</main>

<footer>
  <span>ChatDeck Legacy</span>
  <span>Сворачивается в трей</span>
</footer>

<!-- Модальное окно настроек стиля -->
<div class="modal-backdrop" id="styleModal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2>Стиль оверлея</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    
    <div class="modal-body">
      <!-- Микро-превью -->
      <div class="style-preview-frame">
        <div class="style-preview-line role-broadcaster" id="ovPreview">
          <span class="badges-wrap" id="pvBadgesWrap" style="display:inline-flex;gap:3px;margin-right:5px;vertical-align:middle;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="#a970ff"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>
          </span>
          <b class="username" style="color:#a970ff;font-weight:bold;">neshpak</b>
          <span class="colon">:</span>
          <span>Чат настроен!</span>
          <img class="emote" id="pvEmote" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232ee6a8'><circle cx='12' cy='12' r='10'/><path d='M8 14s1.5 2 4 2 4-2 4-2' stroke='%2316161c' stroke-width='2'/><circle cx='9' cy='9' r='1.5' fill='%2316161c'/><circle cx='15' cy='9' r='1.5' fill='%2316161c'/></svg>" style="height:20px;vertical-align:middle;margin:0 2px;">
        </div>
      </div>

      <!-- Шрифт -->
      <div class="ctl">
        <label>Шрифт</label>
        <select class="ctl-select" id="ovFont">
          <option value="Segoe UI">Segoe UI (системный)</option>
          <option value="Rubik">Rubik</option>
          <option value="Unbounded">Unbounded</option>
          <option value="JetBrains Mono">JetBrains Mono</option>
          <option value="Inter">Inter</option>
          <option value="Impact">Impact</option>
          <option value="Arial">Arial</option>
        </select>
      </div>

      <!-- Размер шрифта -->
      <div class="ctl">
        <label>Размер текста <span id="ovSizeVal">14px</span></label>
        <input type="range" class="ctl-range" id="ovSize" min="10" max="32" value="14">
      </div>

      <!-- Отступ между сообщениями -->
      <div class="ctl">
        <label>Отступ между сообщениями <span id="ovGapVal">6px</span></label>
        <input type="range" class="ctl-range" id="ovGap" min="0" max="24" value="6">
      </div>

      <!-- Цвет текста -->
      <div class="ctl">
        <label>Цвет текста</label>
        <div class="ctl-color-row">
          <input type="color" class="ctl-color" id="ovTextColor" value="#efeff1">
          <input type="text" class="ctl-input ctl-hex" id="ovTextColorHex" value="#EFEFF1" maxlength="7">
        </div>
      </div>

      <!-- Плашка фона -->
      <div class="ctl ctl-row">
        <label>Фоновая плашка</label>
        <label class="switch"><input type="checkbox" id="ovBg" checked><span class="track"></span></label>
      </div>

      <!-- Цвет фона и прозрачность -->
      <div class="ctl" id="ovBgColorWrap">
        <label>Цвет плашки</label>
        <div class="ctl-color-row">
          <input type="color" class="ctl-color" id="ovBgColor" value="#0f0f12">
          <input type="text" class="ctl-input ctl-hex" id="ovBgColorHex" value="#0F0F12" maxlength="7">
        </div>
      </div>

      <div class="ctl" id="ovBgOpacityWrap">
        <label>Непрозрачность <span id="ovBgOpacityVal">82%</span></label>
        <input type="range" class="ctl-range" id="ovBgOpacity" min="10" max="100" value="82">
      </div>

      <!-- Значки -->
      <div class="ctl ctl-row">
        <label>Значки (модер, саб, VIP)</label>
        <label class="switch"><input type="checkbox" id="ovBadges" checked><span class="track"></span></label>
      </div>

      <!-- Выделение ролей -->
      <div class="ctl ctl-row">
        <label>Выделение ролей (полоска слева)</label>
        <label class="switch"><input type="checkbox" id="ovHighlightRoles" checked><span class="track"></span></label>
      </div>

      <!-- Исчезновение -->
      <div class="ctl ctl-row">
        <label>Скрывать старые сообщения</label>
        <label class="switch"><input type="checkbox" id="ovHide" checked><span class="track"></span></label>
      </div>

      <div class="ctl" id="ovHideWrap">
        <label>Время показа <span id="ovHideAfterVal">30с</span></label>
        <input type="range" class="ctl-range" id="ovHideAfter" min="5" max="120" value="30">
      </div>

      <!-- Размер эмодзи -->
      <div class="ctl">
        <label>Размер смайликов <span id="ovEmoteVal">20px</span></label>
        <input type="range" class="ctl-range" id="ovEmote" min="14" max="44" value="20">
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn btn-ghost" id="modalReset">Сбросить по умолчанию</button>
      <button class="btn btn-primary" id="modalDone">Готово</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

let currentObsUrl = 'http://localhost:6767';
let lastMsgs = 0;

const DEFAULTS = {
  font: 'Segoe UI', size: 14, gap: 6,
  textColor: '#efeff1', bgColor: '#0f0f12', bgOpacity: 82,
  showBadges: true, highlightRoles: true, bg: true,
  hide: true, hideAfter: 30, emote: 20
};

const $ovFont = $('ovFont');
const $ovSize = $('ovSize');
const $ovSizeVal = $('ovSizeVal');
const $ovGap = $('ovGap');
const $ovGapVal = $('ovGapVal');
const $ovTextColor = $('ovTextColor');
const $ovTextColorHex = $('ovTextColorHex');
const $ovBg = $('ovBg');
const $ovBgColor = $('ovBgColor');
const $ovBgColorHex = $('ovBgColorHex');
const $ovBgOpacity = $('ovBgOpacity');
const $ovBgOpacityVal = $('ovBgOpacityVal');
const $ovBadges = $('ovBadges');
const $ovHighlightRoles = $('ovHighlightRoles');
const $ovHide = $('ovHide');
const $ovHideAfter = $('ovHideAfter');
const $ovHideAfterVal = $('ovHideAfterVal');
const $ovEmote = $('ovEmote');
const $ovEmoteVal = $('ovEmoteVal');
const $ovPreview = $('ovPreview');
const $pvBadgesWrap = $('pvBadgesWrap');
const $pvEmote = $('pvEmote');
const $styleModal = $('styleModal');
const $trigSummary = $('trigSummary');

function hexToRgba(hex, alpha) {
  let c = (hex || '#0f0f12').replace(/^#/, '');
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const num = parseInt(c, 16);
  if (isNaN(num)) return `rgba(15,15,18,${alpha})`;
  return `rgba(${(num >> 16) & 255},${(num >> 8) & 255},${num & 255},${alpha})`;
}

function refreshPreview() {
  const fontVal = ($ovFont.value || '').trim() || 'Segoe UI';
  const sz = $ovSize.value + 'px';
  const gap = $ovGap.value + 'px';
  const textColor = $ovTextColor.value || '#efeff1';
  const opacity = parseInt($ovBgOpacity.value, 10) / 100;
  const bgRgba = hexToRgba($ovBgColor.value || '#0f0f12', opacity);

  $ovPreview.style.fontFamily = `"${fontVal}", "Segoe UI", Arial, sans-serif`;
  $ovPreview.style.fontSize = sz;
  $ovPreview.style.color = textColor;
  $ovPreview.style.marginBottom = gap;

  if ($pvBadgesWrap) $pvBadgesWrap.style.display = $ovBadges.checked ? 'inline-flex' : 'none';
  if ($ovHighlightRoles) $ovPreview.classList.toggle('role-broadcaster', $ovHighlightRoles.checked);

  $('ovBgColorWrap').classList.toggle('disabled', !$ovBg.checked);
  $('ovBgOpacityWrap').classList.toggle('disabled', !$ovBg.checked);

  if ($ovBg.checked) {
    $ovPreview.style.background = bgRgba;
    $ovPreview.style.padding = '6px 10px';
  } else {
    $ovPreview.style.background = 'transparent';
    $ovPreview.style.padding = '2px 0';
  }

  $ovSizeVal.textContent = sz;
  $ovGapVal.textContent = gap;
  $ovBgOpacityVal.textContent = $ovBgOpacity.value + '%';
  $ovHideAfterVal.textContent = $ovHideAfter.value + 'с';
  $('ovHideWrap').classList.toggle('disabled', !$ovHide.checked);
  $ovEmoteVal.textContent = $ovEmote.value + 'px';
  if ($pvEmote) $pvEmote.style.height = $ovEmote.value + 'px';

  $trigSummary.textContent = `${fontVal} · ${sz} · ${$ovBg.checked ? 'плашка' : 'без фона'} · ${$ovHide.checked ? $ovHideAfter.value + 'с' : 'без исчезн.'}`;
}

let styleSaveTimer = null;
function saveStylePrefs() {
  if (!currentObsUrl) return;
  clearTimeout(styleSaveTimer);
  styleSaveTimer = setTimeout(() => {
    fetch(currentObsUrl + '/api/style', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        font: $ovFont.value.trim() || 'Segoe UI',
        size: parseInt($ovSize.value, 10),
        gap: parseInt($ovGap.value, 10),
        textColor: $ovTextColor.value,
        bgColor: $ovBgColor.value,
        bgOpacity: parseInt($ovBgOpacity.value, 10),
        showBadges: $ovBadges.checked,
        highlightRoles: $ovHighlightRoles.checked,
        bg: $ovBg.checked,
        hide: $ovHide.checked,
        hideAfter: parseInt($ovHideAfter.value, 10) * 1000,
        emote: parseInt($ovEmote.value, 10)
      })
    }).catch(() => {});
  }, 350);
}

function onStyleChange() {
  refreshPreview();
  saveStylePrefs();
}

function openStyleModal() { $styleModal.classList.add('open'); $styleModal.setAttribute('aria-hidden', 'false'); }
function closeStyleModal() { $styleModal.classList.remove('open'); $styleModal.setAttribute('aria-hidden', 'true'); }

$('openStyleBtn').addEventListener('click', openStyleModal);
$('modalClose').addEventListener('click', closeStyleModal);
$('modalDone').addEventListener('click', closeStyleModal);
$('modalReset').addEventListener('click', () => {
  $ovFont.value = DEFAULTS.font;
  $ovSize.value = DEFAULTS.size;
  $ovGap.value = DEFAULTS.gap;
  $ovTextColor.value = DEFAULTS.textColor;
  $ovTextColorHex.value = DEFAULTS.textColor.toUpperCase();
  $ovBgColor.value = DEFAULTS.bgColor;
  $ovBgColorHex.value = DEFAULTS.bgColor.toUpperCase();
  $ovBgOpacity.value = DEFAULTS.bgOpacity;
  $ovBadges.checked = DEFAULTS.showBadges;
  $ovHighlightRoles.checked = DEFAULTS.highlightRoles;
  $ovBg.checked = DEFAULTS.bg;
  $ovHide.checked = DEFAULTS.hide;
  $ovHideAfter.value = DEFAULTS.hideAfter;
  $ovEmote.value = DEFAULTS.emote;
  onStyleChange();
});

$styleModal.addEventListener('mousedown', e => { if (e.target === $styleModal) closeStyleModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $styleModal.classList.contains('open')) closeStyleModal(); });

$ovFont.addEventListener('input', onStyleChange);
$ovSize.addEventListener('input', onStyleChange);
$ovGap.addEventListener('input', onStyleChange);
$ovTextColor.addEventListener('input', () => { $ovTextColorHex.value = $ovTextColor.value.toUpperCase(); onStyleChange(); });
$ovTextColorHex.addEventListener('input', () => {
  const v = $ovTextColorHex.value.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(v)) { $ovTextColor.value = v; onStyleChange(); }
});
$ovBgColor.addEventListener('input', () => { $ovBgColorHex.value = $ovBgColor.value.toUpperCase(); onStyleChange(); });
$ovBgColorHex.addEventListener('input', () => {
  const v = $ovBgColorHex.value.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(v)) { $ovBgColor.value = v; onStyleChange(); }
});
$ovBgOpacity.addEventListener('input', onStyleChange);
$ovBadges.addEventListener('change', onStyleChange);
$ovHighlightRoles.addEventListener('change', onStyleChange);
$ovBg.addEventListener('change', onStyleChange);
$ovHide.addEventListener('change', onStyleChange);
$ovHideAfter.addEventListener('input', onStyleChange);
$ovEmote.addEventListener('input', onStyleChange);

// Загрузка начальных настроек стиля с сервера
function loadInitialStyle() {
  fetch((currentObsUrl || '') + '/api/style').then(r => r.json()).then(s => {
    if (s.font) $ovFont.value = s.font;
    if (s.size) $ovSize.value = s.size;
    if (s.gap != null) $ovGap.value = s.gap;
    if (s.textColor) { $ovTextColor.value = s.textColor; $ovTextColorHex.value = s.textColor.toUpperCase(); }
    if (s.bgColor) { $ovBgColor.value = s.bgColor; $ovBgColorHex.value = s.bgColor.toUpperCase(); }
    if (s.bgOpacity != null) $ovBgOpacity.value = s.bgOpacity;
    if (s.showBadges != null) $ovBadges.checked = s.showBadges;
    if (s.highlightRoles != null) $ovHighlightRoles.checked = s.highlightRoles;
    if (s.bg != null) $ovBg.checked = s.bg;
    if (s.hide != null) $ovHide.checked = s.hide;
    if (s.hideAfter) $ovHideAfter.value = Math.round(s.hideAfter / 1000);
    if (s.emote) $ovEmote.value = s.emote;
    refreshPreview();
  }).catch(() => refreshPreview());
}

loadInitialStyle();

// Интеграция с Electron
window.api.onState(update);
window.api.getState().then(update);

function update(st) {
  currentObsUrl = st.obsUrl || 'http://localhost:6767';
  $('obsUrl').textContent = currentObsUrl;
  $('statChannel').textContent = st.channel ? '#' + st.channel : '—';
  $('statPort').textContent = st.port || '6767';

  const bar = $('statusBar');
  const title = $('statusTitle');
  const tag = $('statusTag');

  if (st.chatConnected) {
    if (st.streamLive) {
      bar.className = 'status-bar live';
      title.textContent = `В эфире: #${st.channel}`;
      tag.textContent = (st.streamViewers > 0) ? `👁 ${st.streamViewers}` : 'В эфире';
    } else {
      bar.className = 'status-bar online';
      title.textContent = `Чат: #${st.channel}`;
      tag.textContent = 'Офлайн';
    }
  } else if (st.channel) {
    bar.className = 'status-bar connecting';
    title.textContent = `Подключение: #${st.channel}…`;
    tag.textContent = 'Подключение';
  } else {
    bar.className = 'status-bar off';
    title.textContent = 'Канал не настроен';
    tag.textContent = 'Настроить';
  }

  const msgsEl = $('statMsgs');
  if (st.messages !== lastMsgs) {
    msgsEl.textContent = st.messages;
    msgsEl.classList.remove('bump'); void msgsEl.offsetWidth; msgsEl.classList.add('bump');
    lastMsgs = st.messages;
  }

  const uptimeEl = $('statUptime');
  const uptimeLabel = $('statUptimeLabel');
  if (st.streamLive && st.streamStartedAt) {
    uptimeEl.textContent = fmtUptime(Date.now() - st.streamStartedAt);
    uptimeEl.style.color = '#ff5c5c';
    if (uptimeLabel) uptimeLabel.textContent = (st.streamViewers > 0) ? `Зрители (${st.streamViewers})` : 'Стрим';
  } else {
    uptimeEl.textContent = 'Офлайн';
    uptimeEl.style.color = '';
    if (uptimeLabel) uptimeLabel.textContent = 'Стрим';
  }
}

function fmtUptime(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h > 0 ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
}

$('copyBtn').addEventListener('click', async () => {
  await window.api.copyText($('obsUrl').textContent);
  const b = $('copyBtn');
  const lbl = b.querySelector('.bl');
  b.classList.add('done'); lbl.textContent = 'Скопировано!';
  setTimeout(() => { b.classList.remove('done'); lbl.textContent = 'Копировать ссылку'; }, 1600);
});

$('openBtn').addEventListener('click', () => window.api.openUrl($('obsUrl').textContent));
$('settingsBtn').addEventListener('click', () => window.api.openSettings());
$('restartBtn').addEventListener('click', () => window.api.restart());
$('quitBtn').addEventListener('click', () => window.api.quit());
</script>
</body>
</html>
